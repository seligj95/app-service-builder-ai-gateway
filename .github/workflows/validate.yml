name: Validate sample

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Restore pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test HTTP and model contracts
        run: python -m unittest discover -s tests -v
      - name: Compile Python and check browser JavaScript
        run: |
          python -m compileall -q app.py config.py gateway.py tests
          node --check static/chat.js
      - name: Compile infrastructure
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
